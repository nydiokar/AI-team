[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-orchestrator"
version = "1.0.0"
description = "UI-controlled gateway for local coding agents with native Claude Code and Codex session resume and automated workflows"
readme = "docs/README.md"
requires-python = ">=3.12"
authors = [{ name = "AI-team" }]
license = "MIT"
dependencies = [
  "watchdog>=7.1.0",
  "pydantic>=2.14.3",
  "python-dotenv>=1.2.4",
  "pyyaml>=6.0.3",
  "fastapi>=0.162.6",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.33",
  "claude-agent-sdk>=0.2.181",
  "anyio>=4.16.0",
  # [A82] backend-process liveness proof for managed-turn recovery; also makes
  # reap_stale_worker_children real (it was a silent no-op without psutil).
  "psutil>=7.2.2",
]

[project.scripts]
# PATH-resolvable, platform-neutral launchers for the MCP stdio servers so the
# host-authoritative backend config (projected into the worker container) can name a
# stable command instead of an OS/host-specific "<python> <abs script path>" pair.
# See src/mcp_launchers.py and scripts/setup_mcp.py.
ai-team-mcp-jobs = "src.mcp_launchers:jobs_main"
ai-team-mcp-manager = "src.mcp_launchers:manager_main"

[project.optional-dependencies]
dev = [
  "ruff>=0.17.5",
  "black>=26.10.1",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-xdist>=3.8.0",
  "httpx>=0.28.1",
]
test = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "pytest-xdist>=3.8.0",
  "httpx>=0.28.1",
]
llama = [
  "ollama>=0.6.3",
]
telegram = [
  "python-telegram-bot>=22.8",
]
push = [
  # Web Push (#21). Optional: absent package or VAPID config => push disabled,
  # gateway keeps running and Telegram delivery is unaffected.
  "pywebpush>=2.5.0",
]
dispatch = [
  "pandas>=3.1.1",
  "pyarrow>=26.0.1",
]

[tool.setuptools]
packages = [
  "src",
  "config",
]
package-dir = {"" = "."}
include-package-data = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
  "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
