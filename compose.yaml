name: ai-team

x-runtime-security: &runtime-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Entry point starts as root only to drop permanently to ai-team.
  cap_add:
    - SETUID
    - SETGID
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "5"

x-controller-volumes: &controller-volumes
  - ${DOCKER_DATA_ROOT:?set DOCKER_DATA_ROOT}/controller/state:/app/state
  - ${DOCKER_DATA_ROOT:?set DOCKER_DATA_ROOT}/controller/logs:/app/logs
  - ${DOCKER_DATA_ROOT:?set DOCKER_DATA_ROOT}/controller/tasks:/app/tasks
  - ${DOCKER_DATA_ROOT:?set DOCKER_DATA_ROOT}/controller/results:/app/results
  - ${DOCKER_DATA_ROOT:?set DOCKER_DATA_ROOT}/controller/summaries:/app/summaries

services:
  task-server:
    <<: *runtime-security

    image: ${AI_TEAM_IMAGE:-ai-team:local}

    build:
      context: .
      target: runtime

    command: ["python", "server_main.py"]

    env_file:
      - ./.env

    environment:
      # Docker-internal topology only.
      MESH_ENABLED: "true"
      MESH_EMBEDDED_SERVER: "false"
      MESH_BIND_HOST: "0.0.0.0"
      # No in-process execution here: skip the gateway self-node registration.
      GATEWAY_LOCAL_EXECUTION_ENABLED: "false"

    restart: unless-stopped

    volumes: *controller-volumes

    ports:
      - "${MESH_TAILSCALE_IP:?set MESH_TAILSCALE_IP}:${MESH_TASK_SERVER_PORT:-9002}:${MESH_TASK_SERVER_PORT:-9002}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; assert urlopen('http://127.0.0.1:' + '$${MESH_TASK_SERVER_PORT:-9002}' + '/health', timeout=3).status == 200\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    <<: *runtime-security

    image: ${AI_TEAM_IMAGE:-ai-team:local}

    build:
      context: .
      target: runtime

    command: ["python", "main.py"]

    env_file:
      - ./.env

    environment:
      # Docker topology only. These override the process binding INSIDE
      # the container, not the host exposure.
      MESH_ENABLED: "true"
      MESH_EMBEDDED_SERVER: "false"
      CONTROL_API_ENABLED: "true"
      CONTROL_API_BIND_HOST: "0.0.0.0"

      # Dedicated Docker controller delegates work to workers.
      GATEWAY_LOCAL_EXECUTION_ENABLED: "false"

    restart: unless-stopped

    volumes: *controller-volumes

    ports:
      # Normally 127.0.0.1 because Tailscale Serve proxies this port.
      - "${DOCKER_GATEWAY_PUBLISH_HOST:-127.0.0.1}:${DASHBOARD_PORT:-9003}:${DASHBOARD_PORT:-9003}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; assert urlopen('http://127.0.0.1:' + '$${DASHBOARD_PORT:-9003}' + '/health', timeout=3).status == 200\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
