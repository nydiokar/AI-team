name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install every supported Python extra
        run: |
          python -m pip install --upgrade pip setuptools wheel -c constraints.txt
          pip install -e ".[dev,test,telegram,push,dispatch,llama]" -c constraints.txt
          pip check

      - name: Install backup integration tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqlite3 zstd

      - name: Run tests
        env:
          CLAUDE_SKIP_PERMISSIONS: "true"
          AI_TEAM_TEST_MODE: "1"
          AI_TEAM_BLOCK_LIVE_CLI: "1"
        run: |
          # -n auto: one xdist worker per runner core (A104 test speed). Each test
          # still gets its own temp DB, seeded from a once-per-session migrated
          # template (tests/conftest.py::_migrated_db_template).
          pytest --tb=short -n auto --durations=15
          pytest .claude/skills/architecture-pathway-audit/tests --tb=short

  isolated-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime and all-extra test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: python-tests
          load: true
          tags: ai-team-python-tests
          cache-from: type=gha,scope=python-tests
          cache-to: type=gha,scope=python-tests,mode=max
      - name: Run complete safe suite without external network or credentials
        run: >-
          docker run --rm --network none --cpus 2
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/workspace
          -v "$GITHUB_WORKSPACE:/workspace"
          ai-team-python-tests --tb=short -n 2 --durations=15
      - name: Build worker image with the same Python stack
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker-agents
          load: true
          tags: ai-team-worker-check
          cache-from: type=gha,scope=worker-agents
          cache-to: type=gha,scope=worker-agents,mode=max
      - name: Verify native agent control and cleanup without a model turn
        run: >-
          docker run --rm --network none --entrypoint python
          -e PYTHONPATH=/workspace -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          ai-team-worker-check tests/fixtures/native_agent_smoke.py
